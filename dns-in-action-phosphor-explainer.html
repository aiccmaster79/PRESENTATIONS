<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phosphor Terminal — DNS in Action</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=block">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0c0c0b;
    color: #e7e1d4;
    font-family: "Space Mono", ui-monospace, monospace;
    display: flex;
    flex-direction: column;
  }
  #stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #stage.drop { outline: 3px solid #8dff9a; outline-offset: -6px; }
  #view {
    width: min(100vw, calc((100vh - 88px) * 16 / 9));
    height: auto;
    max-height: calc(100vh - 88px);
    background: #000;
    display: block;
  }
  #bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    padding: 10px 14px 12px;
    background: #141311;
    border-top: 1px solid #2c2a26;
    font-size: 13px;
  }
  button, label.file {
    background: #1c241c;
    color: #d5f5c8;
    border: 1px solid #3d4a38;
    padding: 6px 10px;
    font: inherit;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid #b6f7a4; outline-offset: 2px; }
  #scrub { flex: 1; min-width: 140px; accent-color: #8dff9a; }
  #clock { min-width: 4.6em; color: #b6f7a4; }
  label.loop { display: flex; align-items: center; gap: 6px; color: #c9c2b4; }
  label.file input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #vlabel { color: #9aa892; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a { color: #b6f7a4; }
  #voice { display: none; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="view" width="1280" height="720" aria-label="DNS in Action, phosphor terminal"></canvas>
  </div>
  <div id="bar">
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="0" max="61.5" step="0.01" value="0" aria-label="Scrub">
    <span id="clock" aria-live="off">0:00.0</span>
    <button id="mute" type="button" aria-pressed="false">Sound on</button>
    <label class="loop"><input id="loop" type="checkbox" checked> Loop</label>
    <label class="file">Load voiceover<input id="file" type="file" accept="audio/*"></label>
    <span id="vlabel"></span>
    <a href="dns-in-action-phosphor-storyboard.html">Storyboard</a>
  </div>
  <audio id="voice" preload="auto"></audio>
<script>

// The silk-screen name is the only copy change: this session is a DNS terminal.

function scroll(s, t, a, d, dist, from, to) {
  const k = ease(a, a + d, t), off = k * dist;
  s.save(); s.translate(0, -off); from(); s.restore();
  s.save(); s.translate(0, dist - off); to(); s.restore();
}
function roll(s, TH, t, a, d, from, to) {
  const k = ease(a, a + d, t), off = k * (TH + 60);
  s.save(); s.translate(0, -off); from(); s.restore();
  s.save(); s.translate(0, TH + 60 - off); to(); s.restore();
  s.fillStyle = '#000'; s.fillRect(0, TH - off - 4, 1088, 64); s.fillStyle = '#fff';
}
let FADE_A = null, FADE_B = null;
function crossfade(s, TW, TH, k, drawA, drawB) {
  if (k <= 0) { drawA(s); return; }
  if (k >= 1) { drawB(s); return; }
  if (!FADE_A || FADE_A.width !== TW || FADE_A.height !== TH) {
    FADE_A = H.layer(TW, TH);
    FADE_B = H.layer(TW, TH);
  }
  const ca = FADE_A.getContext('2d'), cb = FADE_B.getContext('2d');
  ca.setTransform(1, 0, 0, 1, 0, 0); cb.setTransform(1, 0, 0, 1, 0, 0);
  ca.globalAlpha = 1; cb.globalAlpha = 1;
  ca.globalCompositeOperation = 'source-over'; cb.globalCompositeOperation = 'source-over';
  ca.shadowBlur = 0; cb.shadowBlur = 0;
  ca.fillStyle = '#000'; ca.fillRect(0, 0, TW, TH);
  cb.fillStyle = '#000'; cb.fillRect(0, 0, TW, TH);
  drawA(ca); drawB(cb);
  s.drawImage(FADE_A, 0, 0);
  s.globalAlpha = k; s.drawImage(FADE_B, 0, 0); s.globalAlpha = 1;
}

function paint(s, TW, TH, t) {
  const pen = () => makePen(s, TH);
  if (t < 2.55) scene1(pen(), t);
  else if (t < 2.90) scroll(s, t, 2.55, 0.35, 540, () => scene1(pen(), 2.50), () => scene2(pen(), t));
  else if (t < 7.55) scene2(pen(), t);
  else if (t < 7.95) crossfade(s, TW, TH, ease(7.55, 7.95, t), (c) => scene2(makePen(c, TH), 7.50), (c) => scene3(makePen(c, TH), t));
  else if (t < 10.85) scene3(pen(), t);
  else if (t < 11.25) crossfade(s, TW, TH, ease(10.85, 11.25, t), (c) => scene3(makePen(c, TH), 10.80), (c) => scene4(makePen(c, TH), t));
  else if (t < 17.05) scene4(pen(), t);
  else if (t < 17.50) crossfade(s, TW, TH, ease(17.05, 17.50, t), (c) => scene4(makePen(c, TH), 17.00), (c) => scene5(makePen(c, TH), t));
  else if (t < 23.85) scene5(pen(), t);
  else if (t < 24.30) crossfade(s, TW, TH, ease(23.85, 24.30, t), (c) => scene5(makePen(c, TH), 23.80), (c) => scene6(makePen(c, TH), t));
  else if (t < 35.90) scene6(pen(), t);
  else if (t < 36.50) roll(s, TH, t, 35.90, 0.60, () => scene6(pen(), 35.85), () => scene7(pen(), t));
  else if (t < 46.90) scene7(pen(), t);
  else if (t < 47.35) crossfade(s, TW, TH, ease(46.90, 47.35, t), (c) => scene7(makePen(c, TH), 46.85), (c) => scene8(makePen(c, TH), t));
  else if (t < 55.30) scene8(pen(), t);
  else if (t < 55.90) roll(s, TH, t, 55.30, 0.60, () => scene8(pen(), 55.25), () => scene9(pen(), t));
  else scene9(pen(), t);

  let tag = 'READY', withQ = false;
  if (t >= 2.15) {
    withQ = true;
    tag = 'ASK';
    for (let i = 0; i < BEATS.length; i++) if (t >= BEATS[i].start) tag = BEATS[i].tag;
  }
  pen().status(tag, withQ);
}

function explainer(ctx, W, H_, t) {
  let boost = 1;
  if (t >= WT[5][19] && t < WT[5][19] + 0.16) boost = 1.45;
  if (t >= WT[6][18] && t < WT[6][18] + 0.16) boost = 1.40;
  crtCompose(ctx, W, H_, t, (s, TW, TH) => paint(s, TW, TH, t), 5, boost);
}

// Sound: a phosphor terminal under the voice. Big hits stay full; typing, ticks and beams are minor.
function scoreSound(k) {
  const px = (x) => H.clamp(x / 1088) * 1.4 - 0.7;
  const key = (t, p = 0, g = 1) => {
    k.noise(t, { dur: 0.02, filter: 'bandpass', f: 2300, q: 1.6, gain: 0.22 * g, a: 0.001, pan: p, minor: true });
    k.noise(t + 0.006, { dur: 0.05, color: 'brown', filter: 'lowpass', f: 600, gain: 0.3 * g, a: 0.002, pan: p, minor: true });
    k.tone(t, { f: 150, dur: 0.04, gain: 0.08 * g, a: 0.001, pan: p, minor: true });
  };
  const enter = (t, p = 0) => { key(t, p, 1.4); k.noise(t + 0.03, { dur: 0.06, color: 'brown', filter: 'lowpass', f: 400, gain: 0.25, pan: p }); };
  const typeLine = (t0, dur, p = 0) => {
    const r = H.rng(Math.round(t0 * 100));
    for (let t = t0; t < t0 + dur - 0.02; t += 0.07 + r() * 0.04) key(t, p, 0.75 + r() * 0.35);
  };

  };
  const beam = (t, dur, p0 = 0, p1 = 0) => k.noise(t, { dur, filter: 'bandpass', f: [[0, 1400], [dur, 2000]], q: 3, gain: 0.07, a: dur * 0.2, hold: dur * 0.5, pan: (p0 + p1) / 2, minor: true });
  const rollS = (a, d) => {
    k.tone(a, { f: [[0, 62], [d * 0.5, 44], [d, 60]], type: 'sawtooth', dur: d + 0.08, gain: 0.08, a: d * 0.3, hold: d * 0.3, filter: 'lowpass', f2: 380 });

  sq(WT[6][25], 'D3', 0.09, 0.06, { pan: 0 });

  k.noise(46.90, { dur: 0.45, color: 'brown', filter: 'lowpass', f: [[0, 280], [0.2, 700], [0.45, 260]], gain: 0.1, a: 0.12 });
  typeLine(WT[7][3] - 0.16, 0.38, px(180));
  sq(WT[7][6], 'A3', 0.22, 0.09, { hold: 0.14, f2: 1400, pan: px(220) });
  k.play('pop', WT[7][9], { gain: 0.65, pan: px(220) });
  k.withMinor(() => { [WT[7][11] - 0.14, WT[7][12], WT[7][13]].forEach((t) => k.play('tick', t, { f: 2200, gain: 0.6, pan: px(760) })); });
  bell(WT[7][14], 'E4', 1.15, px(780));
  bell(WT[7][14] + 0.1, 'A4', 1.05, px(780));

const FONTS = [
  '30px "VT323"', '32px "VT323"', '36px "VT323"', '40px "VT323"', '44px "VT323"',
  '48px "VT323"', '52px "VT323"', '56px "VT323"', '64px "VT323"', '72px "VT323"',
  '88px "VT323"', '100px "VT323"', '128px "VT323"', '148px "VT323"', '156px "VT323"',
  '700 15px "Space Mono"', '400 11px "Space Mono"'
];

function bootPlayer() {
  const canvas = document.getElementById('view');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const playBtn = document.getElementById('play');
  const scrub = document.getElementById('scrub');
  const clock = document.getElementById('clock');
  const muteBtn = document.getElementById('mute');
  const loopBox = document.getElementById('loop');
  const fileInput = document.getElementById('file');
  const stage = document.getElementById('stage');
  const voice = document.getElementById('voice');

  let playing = false;
  let soundOn = true;
  let stopSound = null;
  let haveVoice = false;
  let anchorT = 0;
  let anchorNow = 0;
  let scrubbing = false;
  let raf = 0;
  let lastVoiceT = 0;
  scrub.max = String(DURATION);
  scrub.step = '0.01';

  function fmt(t) {
    t = Math.max(0, t || 0);
    const m = Math.floor(t / 60);
    const s = t - m * 60;
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  }
  function drawAt(t) {
    explainer(ctx, 1280, 720, Math.max(0, t));
  }
  window.seek = (t) => { drawAt(t); };
  window.DURATION = DURATION;
  window.scoreSound = scoreSound;
  window.explainer = explainer;

  function shownT() {
    if (scrubbing) return parseFloat(scrub.value);
    if (haveVoice) return voice.currentTime || 0;
    if (!playing) return anchorT;
    return anchorT + (performance.now() - anchorNow) / 1000;
  }
  function ui(t) {
    const shown = Math.min(Math.max(0, t), haveVoice ? Math.max(DURATION, voice.duration || DURATION) : DURATION);
    if (!scrubbing) scrub.value = String(Math.min(shown, DURATION));
    clock.textContent = fmt(t);
    playBtn.textContent = playing ? 'Pause' : 'Play';
    muteBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
    muteBtn.setAttribute('aria-pressed', soundOn ? 'false' : 'true');
  }
  function killSound() { if (stopSound) { stopSound(); stopSound = null; } }
  function armSound(t) {
    killSound();
    if (playing && soundOn) stopSound = SOUND.live(scoreSound, t, { voiceover: true });
  }
  function pause() {
    if (haveVoice) {
      anchorT = voice.currentTime || 0;
      voice.pause();
    } else if (playing) {
      anchorT = shownT();
    }
    playing = false;
    killSound();
    ui(anchorT);
  }
  function play() {
    let t = haveVoice ? (voice.currentTime || 0) : anchorT;
    if (!haveVoice && t >= DURATION - 0.02) t = 0;
    anchorT = t;
    anchorNow = performance.now();
    playing = true;
    if (haveVoice) {
      voice.loop = loopBox.checked;
      const p = voice.play();
      if (p && p.catch) p.catch(() => {});
    }
    armSound(t);
    ui(t);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }
  function tick() {
    if (!playing) return;
    let t = shownT();
    if (haveVoice) {
      const vt = voice.currentTime || 0;
      if (vt + 0.35 < lastVoiceT) armSound(vt);
      lastVoiceT = vt;
    }
    if (!haveVoice && t >= DURATION) {
      if (loopBox.checked) {
        anchorT = 0;
        anchorNow = performance.now();
        t = 0;
        armSound(0);
      } else {
        anchorT = DURATION;
        drawAt(DURATION);
        ui(DURATION);
        pause();
        return;
      }
    }
    drawAt(haveVoice ? t : Math.min(t, DURATION));
    ui(t);
    raf = requestAnimationFrame(tick);
  }
  function loadFile(file) {
    if (!file || !file.type.startsWith('audio/')) return;
    const url = URL.createObjectURL(file);
    if (voice.src) URL.revokeObjectURL(voice.src);
    haveVoice = true;
    voice.src = url;
    voice.loop = loopBox.checked;
    voice.currentTime = 0;
    anchorT = 0;
    document.getElementById('vlabel').textContent = file.name;
    drawAt(0);
    ui(0);
    if (playing) {
      voice.play();
      armSound(0);
    }
  }

  playBtn.addEventListener('click', () => { if (playing) pause(); else play(); });
  muteBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    if (!soundOn) killSound();
    else if (playing) armSound(shownT());
    ui(shownT());
  });
  loopBox.addEventListener('change', () => { voice.loop = loopBox.checked; });
  scrub.addEventListener('input', () => {
    scrubbing = true;
    const t = parseFloat(scrub.value);
    killSound();
    if (haveVoice) voice.currentTime = t;
    anchorT = t;
    anchorNow = performance.now();
    drawAt(t);
    ui(t);
  });
  scrub.addEventListener('change', () => {
    scrubbing = false;
    anchorT = parseFloat(scrub.value);
    anchorNow = performance.now();
    if (playing) armSound(anchorT);
  });
  fileInput.addEventListener('change', () => { const f = fileInput.files && fileInput.files[0]; if (f) loadFile(f); });
  voice.addEventListener('ended', () => { if (!voice.loop) pause(); });
  ['dragover', 'drop'].forEach((ev) => {
    document.addEventListener(ev, (e) => { e.preventDefault(); });
  });
  stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('drop'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('drop'));
  stage.addEventListener('drop', (e) => {
    e.preventDefault();
    stage.classList.remove('drop');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    loadFile(f);
  });
  document.addEventListener('keydown', (e) => {
    const tag = e.target && e.target.tagName;
    if (e.code === 'Space' && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'BUTTON' && tag !== 'SELECT') {
      e.preventDefault(); if (playing) pause(); else play();
    }
  });

  drawAt(0);
  ui(0);
  window.__ready = true;
}

const sample = 'AaZz09 NAME ADDRESS www.example.com 172.66.147.243 8.8.8.8';
Promise.all(FONTS.map((f) => document.fonts.load(f, sample))).then(() => document.fonts.ready).catch(() => {}).then(() => bootPlayer());
</script>
